    "https://s206.q4cdn.com/270053503/files/doc_financials/2027/q1/TEAM-Q1-2027-Datasheet.pdf",
]

[[target]]
ticker = "NET"
# The IR feed has stamped every earnings release 4:15:00 PM since Q3 2023. Its CDN ignores our
# cache-buster, so the feed can be up to 10 s old.
expected = 2026-11-05T16:15:00
cik = 1477333
q4_host = "cloudflare.net"
newswire = [
    "Cloudflare",
]
# Cloudflare's newsroom copy of the release, on its own host
