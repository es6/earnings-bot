# Companies we've already researched, so /track can start from what we know. Read by
# earnings_bot.known. Every fact was checked on the date in `checked`.
#
# names      how wire headlines name the company, for matching newswire feeds
# platform   q4, equisolve, notified, investis, own-site or unknown
# reachable  whether the IR site answers the default HTTP client
# soft_404   the site answers 200 for pages that don't exist, so guesses stay out of
#            schedules until the bot can tell
# wire       Business Wire, PR Newswire, GlobeNewswire, none or unknown
# fastest    the first source we can read, judged from past quarters: ir-feed, company-rss,
#            company-page (a page or file on the company's own site), newswire, sec-8k or
#            unknown
# eightk     acceptance times of the last four item 2.02 8-Ks, HH:MM US Eastern, newest first.
#            A few may be other filings under that item. Tesla's leaves out its delivery reports.
# guess      URL templates. {yyyy} {mm} {dd} are the release date, and {m} {d} the same
#            without a leading zero. {fy} {fyy} {fq} are the fiscal year and quarter as the
#            company labels them. {nth} is first to fourth, {NTH} the same in capitals, and
#            {ord} is 1st to 4th. {q4:TEXT} is TEXT in a fourth quarter and nothing otherwise,
#            for headlines that add "and Full Year" then.
# rss_spelled  feeds, in rss or the trial table, polled with a new spelling of the path
#            each time, a few letters percent-encoded, because their cache ignores query
#            strings but has no copy of a new spelling
# trial      more sources, which post like any other (the table keeps its old name):
#            broadcom_newsroom, rss (company feeds), globenewswire and
#            prnewswire_semiconductors (names to match in those feeds), and pages (URL
#            templates of the release page, fetched whole)

