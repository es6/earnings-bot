# Companies we've already researched, so /track can start from what we know. Read by
# earnings_bot.known. Every fact was checked on the date in `checked`.
#
# names      how wire headlines name the company, for matching newswire feeds
# platform   q4, equisolve, notified, investis, own-site or unknown
# reachable  whether the IR site answers automated requests (we never work around a block)
# wire       Business Wire, PR Newswire, GlobeNewswire, none or unknown
# fastest    the first source we can read, judged from past quarters: ir-feed, company-rss,
#            company-page, newswire, sec-8k or unknown
# eightk     acceptance times of the last four earnings 8-Ks, HH:MM US Eastern, newest first
# guess      URL templates. {yyyy} {mm} {dd} are the release date. {fy} {fyy} {fq} are the
#            fiscal year and quarter as the company labels them. {nth} is first to fourth,
#            and {ord} is 1st to 4th.

[company.AAPL]
name = "Apple"
names = ["Apple reports"]
cik = 320193
platform = "q4"
q4_host = "investor.apple.com"
reachable = true
wire = "Business Wire"
release_time = "16:30"
eightk = ["16:30", "16:30", "16:30", "16:30"]
fastest = "company-page"
rss = ["https://www.apple.com/newsroom/rss-feed.rss"]
guess = [
    "https://www.apple.com/newsroom/{yyyy}/{mm}/apple-reports-{nth}-quarter-results/",
    "https://www.apple.com/newsroom/pdfs/fy{fy}q{fq}/FY{fyy}_Q{fq}_Consolidated_Financial_Statements.pdf",
    "https://www.apple.com/newsroom/pdfs/fy{fy}-q{fq}/FY{fyy}_Q{fq}_Consolidated_Financial_Statements.pdf",
]
evidence = "The release is on the Apple newsroom, not in the Q4 press feed. The 8-K has been accepted at 4:30 PM, within seconds of the release, for six quarters."
checked = 2026-10-31

