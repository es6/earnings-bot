name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run that's still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Keep the existing required check name and make it depend on both platforms.
    name: Lint, type check, test
    needs: [linux, windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both platforms to pass
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "$LINUX_RESULT" = success && test "$WINDOWS_RESULT" = success

  linux:
    name: Lint, type check, test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # setup-uv has no floating major tag (like v10), so pin the release commit.
      # Dependabot updates the hash and the version comment together.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Check the release version
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --no-sync python scripts/check_release_version.py "$BASE_SHA"

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

  windows:
    # The bot runs on the owner's Windows PC, where consoles, paths and asyncio's event loop
    # differ from Linux
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest
