name: Mutation testing

# Changes the pure parsers in small ways (a flipped comparison, a dropped branch, a changed
# constant) and runs the tests against each change. A change no test notices is a gap in the
# tests. Weekly, by hand, or when this workflow or its settings change. Reported, not enforced.
on:
  schedule:
    - cron: "0 9 * * 6"  # Saturdays, outside every release window
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mutation.yml

permissions:
  contents: read

jobs:
  mutmut:
    name: Mutation testing on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Run mutmut
        run: uv run --with mutmut==3.8.1 mutmut run --max-children 4

      - name: Report the changes no test noticed
        if: always()
        run: |
          uv run --with mutmut==3.8.1 mutmut results | tee survivors.txt
          {
            echo "## Mutations no test noticed"
            echo '```'
            cat survivors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
