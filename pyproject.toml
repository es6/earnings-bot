[project]
name = "earnings-bot"
version = "0.21.39"
description = "Discord bot that posts company earnings the moment they're released"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Lin" }]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14",
    "anthropic>=1.0",
    "discord-py>=2.7",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.1",
    "tzdata>=2026.6",
]

[project.urls]
Repository = "https://github.com/es6/earnings-bot"

[project.scripts]
earnings-bot = "earnings_bot.__main__:main"
earnings-bot-record = "earnings_bot.recorder:main"
earnings-bot-replay = "earnings_bot.replay:main"
earnings-bot-watchdog = "earnings_bot.watchdog:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: style, F: pyflakes, I: import order, B: bugbear, UP: modern syntax,
# SIM: simplifications, ASYNC: asyncio pitfalls, RUF: ruff-specific, C4: comprehensions,
# PIE/RET/FLY/FURB: needless or dated constructs, PERF: slow loops, PTH: pathlib,
# LOG/G: logging calls, PL: pylint's errors and warnings, PGH: blanket ignores,
# ISC: implicit string concatenation
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF",
    "C4", "PIE", "RET", "FLY", "FURB", "PERF", "PTH", "LOG", "G", "PLE", "PLW", "PGH", "ISC",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import their shared fakes as the tests package, without pytest editing sys.path
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib", "-ra"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A hung test fails on its own instead of stalling the whole run
timeout = 120
# Our warnings are bugs, ResourceWarnings above all (an unclosed database or pipe). The one
# exception is discord.py's own call to re.sub on Python 3.13+, which isn't ours to fix.
filterwarnings = [
    "error",
    "ignore:'count' is passed as positional argument:DeprecationWarning:discord.utils",
]

[tool.coverage.run]
source = ["earnings_bot"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
