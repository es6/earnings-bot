[project]
name = "earnings-bot"
version = "0.1.0"
description = "Discord bot that posts company earnings the moment they're released"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Lin" }]
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7",
    "pydantic-settings>=2.16.2",
]

[project.urls]
Repository = "https://github.com/es6/earnings-bot"

[project.scripts]
earnings-bot = "earnings_bot.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: style, F: pyflakes, I: import order, B: bugbear, UP: modern syntax,
# SIM: simplifications, ASYNC: asyncio pitfalls, RUF: ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
